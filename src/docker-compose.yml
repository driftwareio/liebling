services:
  ghost:
    image: ghost:6
    container_name: ghost
    volumes:
      - ./..:/var/lib/ghost/content/themes/liebling:Z
      - ghost-data:/var/lib/ghost/content/data
    environment:
      NODE_ENV: development
      database__client: sqlite3
      database__connection__filename: content/data/ghost.db
    ports:
      - 2368:2368

volumes:
  ghost-data:
