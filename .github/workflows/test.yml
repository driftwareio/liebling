name: Test
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci --prefix src --no-audit --no-fund
      - run: npm run audit --prefix src
      - run: npm run production --prefix src
      - run: npm run check --prefix src
      - run: npm test --prefix src
      - run: npm exec --prefix src -- playwright install --with-deps chromium
      - run: npm run test:browser --prefix src
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: liebling-theme-${{ github.sha }}
          path: liebling.zip
          if-no-files-found: error
          retention-days: 14
